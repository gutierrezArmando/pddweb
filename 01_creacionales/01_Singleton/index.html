<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrón Singleton - Demo</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <style>
        body { transition: background-color 0.3s, color 0.3s; min-height: 100vh; }
        .card { margin-top: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light text-dark">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Configuración Global</h2>
                    <p class="text-muted">Esta interfaz interactúa con una instancia única (Singleton) que controla el estado de la app.</p>
                    
                    <div class="d-grid gap-2">
                        <button id="btn-light" class="btn btn-outline-primary">Modo Claro</button>
                        <button id="btn-dark" class="btn btn-dark">Modo Oscuro</button>
                    </div>

                    <hr>

                    <div id="status-box" class="alert alert-info mt-3">
                        El tema actual es: <strong id="current-theme">Claro</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
