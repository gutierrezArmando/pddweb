<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrones de Diseño: Singleton & Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: all 0.4s ease; min-height: 100vh; padding-top: 50px; }
        .card { border: none; border-radius: 15px; }
        #form-container { max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center mb-5">
            <div class="col-md-6 text-center">
                <div class="card shadow p-4">
                    <h3>Patrón Singleton</h3>
                    <p class="text-muted">Controlador de Tema Global</p>
                    <div class="btn-group" role="group">
                        <button id="btn-light" class="btn btn-outline-primary">Modo Claro</button>
                        <button id="btn-dark" class="btn btn-dark">Modo Oscuro</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <h3 class="text-center mb-4">Patrón Builder</h3>
                <p class="text-center text-muted">Formulario generado dinámicamente pieza por pieza.</p>
                <div id="form-container">
                </div>
            </div>
        </div>
        <!-- Nueva sección para AbstractFactory -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 text-center">
                <h3>Patrón Abstract Factory</h3>
                <div id="factory-display" class="p-4 border rounded bg-white">
                    </div>
                <div class="mt-3">
                    <button id="btn-factory-pro" class="btn btn-secondary btn-sm">Usar Fábrica Pro</button>
                    <button id="btn-factory-danger" class="btn btn-secondary btn-sm">Usar Fábrica Peligro</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
